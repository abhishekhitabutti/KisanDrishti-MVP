name: tests

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'android/**'
      - 'backend/**'
      - '*.md'
      - '.gitignore'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - 'android/**'
      - 'backend/**'
      - '*.md'
      - '.gitignore'
  workflow_dispatch:

jobs:
  test:
    name: Run Python Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Train model and verify artifacts
        run: |
          python train.py

      - name: Run pytest
        run: |
          pytest tests/ -v
