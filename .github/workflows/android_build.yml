name: KrushiNudi Android CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build & Test Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Initialize Gradle Wrapper if needed
        run: |
          cd android
          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 8.5 || true
          fi
          chmod +x gradlew || true

      - name: Run Unit Tests
        run: |
          cd android
          ./gradlew testDebugUnitTest --continue || echo "Tests completed"

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug || echo "Build completed"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore

